<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page not found — Lessy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .nf{min-height:100svh;display:grid;place-content:center;gap:18px;padding:var(--gut);text-align:left}
    .nf .big{font-size:clamp(6rem,26vw,20rem);font-weight:800;letter-spacing:-.06em;line-height:.8;color:var(--accent)}
    .nf p{font-size:clamp(1.1rem,2vw,1.6rem);max-width:24em}
    .nf .btn{justify-self:start}
  </style>
</head>
<body>
  <main class="nf">
    <span class="big" aria-hidden="true">404</span>
    <h1>That page doesn’t exist.</h1>
    <p>The link may be old, or I may have moved things around. The good stuff is on the home page.</p>
    <a class="btn btn-primary" href="/">Take me home</a>
  </main>
</body>
</html>
